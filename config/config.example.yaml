influxdb:
  org: ${INFLUXDB_ORG}
  bucket: ${INFLUXDB_BUCKET}
  measurement: Gait
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  verify: false
  timeout: 900000
postgresql:
  host: ${POSTGRES_HOST}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB}
  port: 5432
movement:
  accel_threshold: 0.2
  gyro_threshold: 75
  accel_power_threshold: 0.125
  gyro_power_threshold: 1000
  freq_band_min: 0.4
  freq_band_max: 1.6
  min_continuous_hits: 3
paths:
  registry_csv: ../tests.csv
  output_folder: ../data/raw
  h5_path: ../data/raw/gait_study_data.h5
  output_dataset: ../DatasetMaestro.xlsx
  output_report: ../INFORME_CLINICO_FINAL.xlsx
processing:
  fs: 100
batch:
  test_type: 6MWT
project:
  language: es
