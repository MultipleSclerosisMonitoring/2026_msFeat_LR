influxdb:
  org: ${INFLUXDB_ORG}
  bucket: ${INFLUXDB_BUCKET}
  measurement: Gait
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  verify_ssl: true              # verificar el certificado TLS del servidor (recomendado)
  retry_waits_s: [5, 15, 45]    # esperas antes de reintentar; solo ante errores de red (no ante 401/400). [] = sin reintentos
  connect_timeout: 10000        # ms para establecer la conexión; el de lectura es timeout
  # ssl_ca_cert: ../certs/ca.pem  # opcional: CA propia si el certificado no es de una CA pública
  timeout: 900000
postgresql:
  host: ${POSTGRES_HOST}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB}
  port: 5432
  # connect_timeout: 10         # opcional, en segundos; sin esta clave no se aplica timeout
registry:
  exclude_codeids: []           # pacientes cuyos eventos no se procesan (quedan como EXCLUDED), p. ej. [AMIR-48]
paths:
  registry_csv: ../tests.csv
  output_folder: ../data/raw
  h5_path: ../data/raw/gait_study_data.h5
  output_dataset: ../resultados_excel/DatasetMaestro.xlsx   # si una ejecución termina sin datos, el anterior se aparta aquí como DatasetMaestro.anterior-AAAAMMDD-HHMMSS.xlsx
  # results_folder: ../data/results   # eventos detectados por ensayo; por defecto, junto a la carpeta del almacén
processing:
  # Todos los parámetros son opcionales; se muestran los valores por defecto.
  # Ventanas y distancias en segundos: se convierten a muestras con la
  # frecuencia efectiva medida en cada serie. Los valores usados se exportan
  # en la hoja Parametros del Excel.
  fs: 50                        # frecuencia nominal (Hz); depende del sensor, solo señala las series distintas
  time_grid: uniform            # uniform: muestras recolocadas a paso constante | received: marcas tal como llegaron
  fs_tolerance: 0.10            # desviación relativa admitida frente a la nominal
  # --- Huecos y cobertura, por grupo de sensores (IMU y presión) ---
  max_gap_s: 0.1                # la serie se corta en tramos si dos filas seguidas se separan más de 100 ms
  max_interpolation_s: 0.1      # relleno máximo sin valor nuevo en cada grupo (IMU solo con el pie en movimiento); por encima, hueco del grupo
  reception_window_s: 0.2       # tras un intervalo largo entre filas se cuentan las muestras de los 200 ms siguientes...
  reception_min_fraction: 0.9   # ...y si llega el 90 % de las esperadas es recepción retrasada, no un hueco
  # Calidad de la IMU: se juzga con la presión, que es independiente del giroscopio.
  pressure_active_window_s: 1.0     # la presión está activa si en 1 s centrado en la muestra algún sensor varía...
  pressure_active_min_fraction: 0.25  # ...al menos el 25 % de su rango (p5-p95)...
  pressure_active_min_units: 20.0   # ...y al menos 20 unidades
  imu_max_stale_active: 0.30    # IMU válida si repite valor en menos del 30 % de las filas con presión activa
  imu_min_active_s: 30.0        # con menos de 30 s de presión activa la IMU no es evaluable y sus métricas no se calculan
  min_coverage: 0.8             # fracción mínima del tiempo fuera de huecos, en la presión
  # --- Zancadas válidas mínimas, por prueba (en TUG no se informan métricas de marcha) ---
  # Una prueba que no figure aquí no informa métricas de marcha.
  min_strides:
    6MWT: 30                    # en el ensayo completo
    2MWT: 10
    T25FW: 4                    # juntando los intentos del paciente en el mismo día
  min_strides_minute: 20        # en cada minuto que compara el decaimiento
  skip_first_strides: 1         # zancadas de arranque que se descartan en cada pie al inicio de cada ensayo
  # --- Filtros ---
  filter_order: 4
  pressure_window_s: 0.15
  # --- Calidad del talón: ritmo de marcha si la ventana es larga; rango si es corta ---
  heel_highpass_hz: 0.3         # paso alto que quita la deriva del talón antes de medir su ritmo
  heel_rhythm_window_s: 20.0    # el ritmo se mide por ventanas de 20 s; las que no lo tienen se excluyen
  heel_min_periodicity: 0.3     # altura mínima del pico de autocorrelación dentro del periodo de zancada
  pressure_min_range: 40.0      # rango mínimo del talón cuando la ventana no da para medir el ritmo
  heel_valley_prominence: 0.3   # profundidad mínima del valle de apoyo, como fracción del rango del talón
  # --- Orientación: gravedad estimada en reposo ---
  rest_gyro_quantile: 0.25      # fracción de muestras con menos giro candidatas a reposo
  rest_accel_tolerance_g: 0.1   # en reposo, el módulo de la aceleración está a esta distancia de 1 g
  # --- Giros por ángulo acumulado ---
  turn_axis: vertical           # giro en torno a la vertical estimada (Gy si no se puede estimar); o un canal del giroscopio: Gx, Gy o Gz
  turn_smooth_cutoff_hz: 0.5    # quita la oscilación de cada zancada (provisional)
  turn_threshold: 25.0          # velocidad de giro suavizada (grados/s) que debe superarse en el episodio (provisional)
  turn_extend_threshold: 10.0   # el episodio se extiende hasta bajar de esta velocidad, para no perder ángulo (provisional)
  turn_min_angle_deg: 90.0      # ángulo acumulado mínimo para contar un giro
  turn_min_duration_s: 0.0      # duración mínima adicional; 0 = no se exige
  turn_margin_before_strides: 3 # zancadas de cada pie que se excluyen antes de cada giro (frenada)
  turn_margin_after_strides: 2  # y después (arranque); solo si la IMU es válida y hay giros detectados
  min_steady_s: 3.0
  # --- Zancadas: contacto de talón por presión ---
  heel_channel: S2              # S2 = talón; S0 y S1 = antepié
  pressure_stance_is_low: true  # lo que se guarda es una tensión que baja con la carga: valor bajo = apoyo
  cycle_min_s: 0.8              # tiempo de zancada mínimo y separación mínima entre contactos de talón
  cycle_max_s: 2.5              # tiempo de zancada máximo
  swing_min_s: 0.25             # balanceo de un ciclo válido: duración...
  swing_max_s: 0.8
  swing_min_prc: 20.0           # ...y porcentaje del ciclo
  swing_max_prc: 55.0
  cadence_min: 24.0             # zancadas por minuto: 60 / cycle_max_s
  cadence_max: 75.0             # 60 / cycle_min_s
  # --- 6MWT completo y decaimiento ---
  decay_block_s: 60.0           # el ensayo se analiza por minutos
  sixmwt_duration_s: 360.0      # la ventana del registro debe durar 360 s...
  sixmwt_tolerance_s: 5.0       # ...± 5 s
  sixmwt_min_valid_minutes: 5   # minutos con datos válidos para aceptarlo como completo
  decay_min_minutes: 4          # minutos con cadencia para ajustar la pendiente; el primero y el último, obligatorios
  # --- Longitud y altura (integración entre pies planos, sin constantes) ---
  stride_ok_min_cm: 30.0        # banda de plausibilidad de la longitud
  stride_ok_max_cm: 150.0
  t25fw_distance_m: 7.62        # 25 pies; solo para avisar si la suma de longitudes de un intento no cuadra (no valida ni calibra)
  # MTC (Müller 2021). Con el módulo en el tobillo no se calcula; la banda queda para cuando pueda medirse.
  mtc_ok_min_cm: 0.4
  mtc_ok_max_cm: 5.5
  mtc_stride_max_cm: 6.0
  gravity: 9.81
batch:
  test_type: 6MWT
project:
  language: es
