influxdb:
  bucket: "bucket"
  # 🇬🇧 The name of the bucket where the gait signals are stored.
  # 🇪🇸 El nombre del bucket donde están almacenadas las señales de marcha.

  org: "organización"
  # 🇬🇧 The name of the organization inside InfluxDB.
  # 🇪🇸 El nombre de la organización dentro de InfluxDB.

  token: "TOKEN de ACCESO"
  # 🇬🇧 Your private API Token with read access to the database.
  # 🇪🇸 Tu Token de API privado con permisos de lectura a la base de datos.

  url: "url"
  # 🇬🇧 The URL of your InfluxDB server. Use the actual domain name to avoid SSL errors.
  # 🇪🇸 La URL de tu servidor InfluxDB. Usa el nombre de dominio real para evitar errores SSL.


