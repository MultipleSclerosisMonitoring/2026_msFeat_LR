[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gait_analysis"
requires-python = ">=3.11"
version = "0.1.0"
dependencies = [
    "pandas",
    "pydantic",
    "influxdb-client",
    "tables",
    "pyyaml",
    "python-dotenv>=1.0",
    "scipy",
    "matplotlib",
    "openpyxl"
]

[tool.setuptools.packages.find]
where = ["src", "pkgs"]
include = ["gait_analysis*", "msConfig*", "msTools*"]
