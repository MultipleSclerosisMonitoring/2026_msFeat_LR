influxdb:
  org: ${INFLUXDB_ORG}
  bucket: ${INFLUXDB_BUCKET}
  measurement: Gait
  url: ${INFLUXDB_URL}
  token: ${INFLUXDB_TOKEN}
  verify_ssl: true
  timeout: 900000
postgresql:
  host: ${POSTGRES_HOST}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  database: ${POSTGRES_DB}
  port: 5432
movement:
  accel_threshold: 0.2
  gyro_threshold: 75
  # Potencia de banda integrada en frecuencia (PSD x Hz). Son los umbrales anteriores
  # (0.125 y 1000, suma de bins) multiplicados por la resolucion anterior, 50 Hz / 256.
  accel_power_threshold: 0.0244140625
  gyro_power_threshold: 195.3125
  freq_band_min: 0.4
  freq_band_max: 1.6
  min_continuous_seconds: 10    # valor operativo: duracion minima de la racha activa
  # Opcionales (se muestran los valores por defecto):
  # max_pause_s: 2.5            # pausa maxima dentro de una racha; por defecto 1 / freq_band_min
  # merge_gap_s: 10             # hueco maximo entre tramos que pueden unirse
  # fs_tolerance: 0.10          # desviacion de la frecuencia medida frente a la nominal que se avisa
  # tail_policy: align          # ultima ventana: align (alineada al final) | minimum (exige tail_min_samples)
